<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Typo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="homeworktypo.css">
</head>
<body class="nunito-regular">
    <h1>Домашнє завдання з типографіки</h1>
    <p>
     <h2>Вибір статі</h2>
     <label class="radio-option">
        <input type="radio" name="gender">
        Чоловіча
     </label>
        <label class="radio-optionn">
            <input type="radio" name="gender">
            Жіноча
        </label>
        <h2>Вибір міста</h2>
        <select class="select-option">
            <option value="">Виберіть місто</option>
            <option>Одеса</option>
            <option>Київ</option>
            <option>Львів</option>
        </select>
        <h2>Вибір кольору</h2>
        <label class="checkbox-optionn" >
            <input type="checkbox">
            Зелений
        </label>
        <label class="checkbox-optiont">
            <input type="checkbox">
            Червоний
        </label>
        <label class="checkbox-option">
            <input type="checkbox">
            Синій
        </label>
        
</body>
</html>
